# Permite que las reglas locales de .htaccess tengan efecto en el directorio de la aplicacion.
<Directory /var/www/html>
    # Autoriza las directivas .htaccess en todas las subcarpetas de la raiz web.
    AllowOverride All
    # Permite que Apache atienda solicitudes para los archivos publicos del sitio.
    Require all granted
</Directory>